# BillOK 8.10 — stage A only. Enable this file BEFORE issuing a cert.
# No upstream, no app publication. Remove this vhost when enabling stage B.
server {
    listen 89.169.2.31:80;
    server_name billok.ru;

    server_tokens off;
    access_log /var/log/nginx/billok-acme-access.log;
    error_log /var/log/nginx/billok-acme-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/billok-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
