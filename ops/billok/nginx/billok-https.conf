# BillOK 8.10 — stage B. Enable only AFTER certonly succeeded.
# Requires /etc/letsencrypt/live/billok.ru/{fullchain,privkey}.pem
# and the application bound to 127.0.0.1:3000, never a public interface.
# Do not enable simultaneously with billok-acme.conf.
map $http_upgrade $billok_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 89.169.2.31:80;
    server_name billok.ru;
    server_tokens off;

    access_log /var/log/nginx/billok-http-access.log;
    error_log /var/log/nginx/billok-http-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/billok-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://billok.ru$request_uri;
    }
}

server {
    listen 89.169.2.31:443 ssl;
    server_name billok.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/billok.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billok.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BILLOK_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    access_log /var/log/nginx/billok-https-access.log;
    error_log /var/log/nginx/billok-https-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host billok.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host billok.ru;
        proxy_set_header X-Forwarded-Port 443;

        # Support long-lived real-time connections without response buffering.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $billok_connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }
}
