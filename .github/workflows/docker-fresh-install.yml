name: Docker External PostgreSQL Smoke

# Manual smoke requires preprovisioned billok_pg_test and root-owned secrets:
# a fresh install on an empty data volume, restarts the way every existing
# install does on upgrade, including schema creation and manual receipts. The Test workflow runs the app with
# `npm run start` against its own database, so it never exercises the
# entrypoint, the pre-push SQL migrations, or the packages the Dockerfile
# adds. Run it locally with `npm run test:docker`.

# 8.2: manual only; require a separate Docker-capable isolated runner.
# The regular ci-runner has no Docker-daemon permission. 8.9 owns Docker
# isolation tests; 8.4 owns release/publication protection.
on:
  workflow_dispatch:

concurrency:
  group: docker-fresh-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    runs-on: [self-hosted, Linux, X64, billok-docker-smoke]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: billok:ci
          # Reuse the layers the main-branch image build caches.
          cache-from: type=gha,scope=main-image

      - name: Smoke test the image
        run: scripts/docker-smoke.sh --image billok:ci
