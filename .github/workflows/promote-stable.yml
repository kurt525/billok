name: Promote to Stable

# 8.4: Git stable tag is never rewritten; a full SHA is mandatory.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Полный SHA коммита main (40 шестнадцатеричных символов)"
        required: true
        type: string
      confirm_stable:
        description: "Введите РАЗРЕШАЮ STABLE BILLOK после приёмки"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      vars.BILLOK_STABLE_PROMOTION_APPROVED == 'true' &&
      inputs.confirm_stable == 'РАЗРЕШАЮ STABLE BILLOK'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact main commit
        id: resolve
        env:
          PROMOTE_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PROMOTE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Expected a complete lower-case 40-digit commit SHA"
            exit 1
          fi
          git cat-file -e "$PROMOTE_REF^{commit}"
          git merge-base --is-ancestor "$PROMOTE_REF" origin/main
          echo "sha=$PROMOTE_REF" >> "$GITHUB_OUTPUT"
          echo "short_sha=${PROMOTE_REF:0:7}" >> "$GITHUB_OUTPUT"
          echo "ref=$PROMOTE_REF" >> "$GITHUB_OUTPUT"

      # 8.4: never modify existing Git tags or force-push stable.
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image as stable
        run: |
          SHA_TAG="${{ steps.resolve.outputs.sha }}"
          SHORT="${{ steps.resolve.outputs.short_sha }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Try full SHA tag first, then short SHA
          if docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
            SOURCE="${IMAGE}:${SHA_TAG}"
          elif docker buildx imagetools inspect "${IMAGE}:${SHORT}" >/dev/null 2>&1; then
            SOURCE="${IMAGE}:${SHORT}"
          else
            echo "::error::No Docker image found for SHA ${SHORT}. Build may still be in progress."
            exit 1
          fi

          docker buildx imagetools create --tag "${IMAGE}:stable" "${SOURCE}"
          echo "Tagged ${SOURCE} as ${IMAGE}:stable"

      - name: Summary
        run: |
          {
            echo "## Promoted to stable"
            echo ""
            echo "- **Ref:** \`${{ steps.resolve.outputs.ref }}\`"
            echo "- **SHA:** \`${{ steps.resolve.outputs.short_sha }}\`"
            echo "- **Docker:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable\`"
            echo ""
            echo "Update your Unraid container to pull the \`stable\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
