name: BillOK Manual Release

# 8.4: no automatic release on push or ordinary CI.
# Owner must explicitly approve repository variable and dispatch on main.
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Введите РАЗРЕШАЮ РЕЛИЗ BILLOK после приёмки"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      vars.BILLOK_RELEASE_APPROVED == 'true' &&
      inputs.confirm_release == 'РАЗРЕШАЮ РЕЛИЗ BILLOK'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release tag
        id: tag
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Count existing tags for today to get build number
          BUILD_NUM=1
          while git rev-parse "build/${DATE}.${BUILD_NUM}" >/dev/null 2>&1; do
            BUILD_NUM=$((BUILD_NUM + 1))
          done

          TAG="build/${DATE}.${BUILD_NUM}"
          DISPLAY="${DATE}.${BUILD_NUM}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "display=${DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous auto-release tag
          PREV_TAG=$(git tag -l 'build/*' --sort=-version:refname | head -1)

          {
            echo "body<<EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "## Initial auto-release"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges -10
            fi
            echo ""
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Build ${{ steps.tag.outputs.display }}"
          body: ${{ steps.changelog.outputs.body }}
          prerelease: false
