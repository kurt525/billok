name: BillOK Dependency Audit

# Manual, non-publishing audit on the dedicated runner; no upstream
# scheduling or duplicate GitHub-hosted CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, billok]
    timeout-minutes: 25
    steps:
      - name: Checkout BillOK
        uses: actions/checkout@v4

      - name: Use preinstalled Node.js 22.23.4
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$RUNNER_TOOL_CACHE/node/22.23.4/x64/bin"
          test -x "$node_bin/node"
          echo "$node_bin" >> "$GITHUB_PATH"
          "$node_bin/node" --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Audit development dependencies (informational)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high
