services:
  sharetab:
    labels:
      ru.billok.project: billok
      ru.billok.component: application
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    image: sharetab:latest
    # Issue #1 8.10: upstream is reachable ONLY from the VPS loopback.
    # Never bind the application container on 0.0.0.0 or the public IP.
    ports:
      - "127.0.0.1:${BILLOK_INTERNAL_PORT:-3000}:3000"
    environment:
      - DB_USER=${DB_USER:-sharetab}
      - DB_NAME=${DB_NAME:-sharetab}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-false}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST:-}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT:-587}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - UPLOAD_DIR=/app/uploads
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-5}
      - AUTH_IP_RATE_LIMIT_MAX=${AUTH_IP_RATE_LIMIT_MAX:-30}
      - REGISTER_RATE_LIMIT_MAX=${REGISTER_RATE_LIMIT_MAX:-10}
      - GUEST_RATE_LIMIT_MAX=${GUEST_RATE_LIMIT_MAX:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - uploads:/app/uploads
      # 8.11: secrets only in root-owned host files, not container environment.
      - type: bind
        source: /etc/billok/secrets
        target: /run/billok-secrets
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    # Combined PostgreSQL + Next.js container. No production deployment in 8.9.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: "2.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Give the entrypoint time to stop Node and shut PostgreSQL down cleanly
    stop_grace_period: 30s
    healthcheck:
      # Healthy only when both the bundled PostgreSQL and web process respond.
      test:
        - CMD-SHELL
        - su-exec postgres pg_isready -q -h /run/postgresql && wget -qO- http://127.0.0.1:3000/api/health >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Explicitly named, independently recoverable BillOK-only volumes.
# Do not use docker compose down --volumes or reuse another project's volumes.
volumes:
  pgdata:
    name: billok_pgdata
    labels:
      ru.billok.project: billok
      ru.billok.data: postgres
  uploads:
    name: billok_uploads
    labels:
      ru.billok.project: billok
      ru.billok.data: uploads
